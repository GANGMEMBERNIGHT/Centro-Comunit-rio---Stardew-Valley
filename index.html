      body {

        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 50px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      h1 {
        color: #ffffff;
        text-align: center;
        font-size: 36px;
        margin-bottom: 50px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 2px 4px 10px rgba(0, 0, 0, 0.6);
      }

      .container-geral {
        display: flex;
        flex-direction: column;
        gap: 45px;
        width: 100%;
        max-width: 1000px;
      }

      .secao-painel {
        background-color: #16213e;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 30px;
        box-shadow: 0px 12px 35px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      .topo-sala {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      .secao-titulo {
        color: #a2d2ff;
        font-size: 22px;
        font-weight: 700;
        margin: 0;
        text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.5);
      }

      .wrapper-imagem {
        display: block;
        flex-shrink: 0;
      }

      .banner-secao-preview {
        width: 100%;
        max-width: 450px;
        height: 65px;
        border: none;
        background-color: #0f3460;
        border-radius: 12px;
        object-fit: cover;
        display: block;
        box-shadow: inset 0px 2px 6px rgba(0, 0, 0, 0.5);
      }

      .blocos-linha {
        background-color: #0f3460;
        border: 1px solid #1a1a2e;
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: inset 0px 4px 10px rgba(0, 0, 0, 0.3);
      }

      .bloco-item {
        background-color: #1a1a2e;
        border: 2px solid #533483;
        padding: 14px 20px;
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 20px;
        border-radius: 10px;
      }

      .bloco-item.concluido {
        background-color: #0f2027;
        border-color: #203a43;
      }

      .checkbox-custom {
        appearance: none;
        width: 24px;
        height: 24px;
        border: 2px solid #e94560;
        background-color: #16213e;
        border-radius: 6px;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
      }

      .checkbox-custom:checked {
        background-color: #e94560;
        border-color: #ff6b81;
      }

      .checkbox-custom:checked::after {
        content: "✔";
        color: white;
        font-size: 13px;
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
      }

      .img-bloco-preview {
        width: 48px;
        height: 48px;
        border: 2px solid #533483;
        border-radius: 8px;
        object-fit: cover;
      }

      .bloco-texto {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-grow: 1;
      }

      .nome-item {
        font-weight: 600;
        font-size: 15px;
        color: #ffffff;
        margin: 0;
      }

      .bloco-item.concluido .nome-item {
        text-decoration: line-through;
        color: #8888aa;
        opacity: 0.6;
      }

      .subtexto {
        font-size: 11px;
        color: #9999bb;
        font-weight: 500;
        margin-top: 1px;
      }
    </style>

      const STORAGE_KEY = "stardew-centro-comunitario-checks";

      function loadCheckboxState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return {};
          const parsed = JSON.parse(raw);
          return parsed && typeof parsed === "object" ? parsed : {};
        } catch {
          return {};
        }
      }

      function saveCheckboxState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function itemStorageKey(salaIndex, itemIndex) {
        return `${salaIndex}-${itemIndex}`;
      }

      const checkboxState = loadCheckboxState();

      const container = document.getElementById("container-geral");

      dadosDasSalas.forEach((sala, salaIndex) => {
        const painel = document.createElement("div");
        painel.className = "secao-painel";
        const bannerSrc =
          sala.imagemBanner ||
          "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='450' height='70'><rect width='450' height='70' rx='12' fill='%230f3460'/><text x='50%' y='55%' text-anchor='middle' fill='%23a2d2ff' font-family='sans-serif' font-weight='600' font-size='13'>Conjunto de Recursos da Sala</text></svg>";

        painel.innerHTML = `
                <div class="topo-sala">
                    <h2 class="secao-titulo">${sala.nomeDaSala}</h2>
                    <div class="wrapper-imagem"><img class="banner-secao-preview" src="${bannerSrc}"></div>
                </div>
                <div class="blocos-linha"></div>
            `;

        const blocosLinha = painel.querySelector(".blocos-linha");
        sala.itens.forEach((item, itemIndex) => {
          const storageKey = itemStorageKey(salaIndex, itemIndex);
          const savedChecked = Boolean(checkboxState[storageKey]);

          const itemDiv = document.createElement("div");
          itemDiv.className = savedChecked
            ? "bloco-item concluido"
            : "bloco-item";
          itemDiv.innerHTML = `
                    <input type="checkbox" class="checkbox-custom"${savedChecked ? " checked" : ""}>
                    <div class="wrapper-imagem"><img class="img-bloco-preview" src="${item.imagem || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48' viewBox='0 0 24 24' fill='none' stroke='%23533483' stroke-width='2'><circle cx='12' cy='12' r='10'/></svg>"}"></div>
                    <div class="bloco-texto">
                        <p class="nome-item">${item.nome}</p>
                        <span class="subtexto">Marque a caixa ao lado se já coletou este item</span>
                    </div>
                `;

          const checkbox = itemDiv.querySelector(".checkbox-custom");
          checkbox.addEventListener("change", () => {
            const checked = checkbox.checked;
            itemDiv.classList.toggle("concluido", checked);
            checkboxState[storageKey] = checked;
            saveCheckboxState(checkboxState);
          });

          blocosLinha.appendChild(itemDiv);
        });
        container.appendChild(painel);
      });
    </script>
